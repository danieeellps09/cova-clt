<body>
<div id="topoP">
  <div class="crP" id="crP">
    <canvas id="fotoP"></canvas>
    <div class="idP"><b>FULANO DE TAL</b><span>OPERADOR DE PICARETA</span><span class="set">SETOR: TÚNEL — FRENTE DE TRABALHO</span></div>

  </div>

<script>
'use strict';

const WX = 300;                                       // x do trabalhador (~33% da largura)

/* ===== Orientação e escala: landscape desenha tudo no canvas; portrait usa HTML ao redor da cena ===== */

function $g(id) { return document.getElementById(id); }
function orientacao() { PORT = innerWidth < innerHeight; document.body.className = PORT ? 'portrait' : 'landscape';

  if (PORT) return;                          // em portrait os controles são HTML
  const p = pos(e); V.mx = p.x; V.my = p.y;
  if (V.fim) { if (V.fimBtn && dentro(p.x, p.y, V.fimBtn)) location.reload(); return; }
  if (V.popup) { if (V.okRect && dentro(p.x, p.y, V.okRect)) V.popup = null; return; }
  if (dentro(p.x, p.y, BTN)) { V.btnT = agora(); trabalhar(); return; }
  LOJA.forEach((it, i) => { if (dentro(p.x, p.y, itemRect(i))) it.acao(); });
});
addEventListener('keydown', e => { if (e.target.closest?.('button')) return; if ((e.key === ' ' || e.key === 'Enter') && !V.fim) { e.preventDefault(); if (V.popup) V.popup = null; else { V.btnT = agora(); trabalhar(); } } });
requestAnimationFrame(desenhar);
</script>
</body>
